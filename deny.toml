[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled in by fontdue; this is an unmaintained notice rather than a vulnerability, and no safe upgrade is available. Reassess or replace fontdue before the public 1.0 release." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
