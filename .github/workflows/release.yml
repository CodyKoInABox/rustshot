name: Prepare Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc

      - name: Verify tag matches Cargo package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = $metadata.packages[0].version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match Cargo package version $packageVersion"
          }

      - name: Run release gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --target $env:TARGET --all-targets -- -D warnings
          cargo test --locked --target $env:TARGET --all-targets
          cargo build --locked --release --target $env:TARGET

      - name: Generate third-party license notices
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $packageName = "rustshot-$tag-windows-x86_64"
          $packageDirectory = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          Copy-Item "target\$env:TARGET\release\rustshot.exe" $packageDirectory
          Copy-Item README.md, LICENSE, CHANGELOG.md, SUPPORT.md, SECURITY.md, SECURITY-AUDIT.md, THIRD-PARTY-LICENSES.txt $packageDirectory
          $archive = "$packageName.zip"
          Compress-Archive -Path "$packageDirectory\*" -DestinationPath "dist\$archive"
          $hash = (Get-FileHash "dist\$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$archive" | Set-Content "dist\$archive.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: rustshot-${{ github.ref_name }}-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".zip", ".sha256" } | ForEach-Object { $_.FullName }
          gh release create $tag $assets --draft --verify-tag --generate-notes --title "Rustshot $tag"
