name: Bug report
description: Report a reproducible RustShot problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private screenshots or report security vulnerabilities here. Use SECURITY.md for security reports.
  - type: input
    id: version
    attributes:
      label: RustShot version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other / unsupported
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence of actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: Include monitor count, resolutions, scaling percentages, and relative arrangement.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Review the generated report before pasting it. Remove paths or shortcuts you do not want to share.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Safety checklist
      options:
        - label: I reviewed all attachments and diagnostic text for private information.
          required: true
        - label: This is not a security vulnerability.
          required: true
